# Cockpit: ⌘+1..6 → Karten-Fokus (ersetzt Tab-Wechsel; Tabs weiterhin über ⌘+Shift+[ / ])
# In ~/.config/ghostty/config einfügen, danach ⌘+Shift+, (reload_config).
#
# WARUM JEDE ZIFFER ZWEIMAL (korrigiert 2026-08-04):
# Ghostty führt je Taste ZWEI Steckplätze — die PHYSISCHE Taste
# (`physical:one`, intern `digit_1`) und das erzeugte ZEICHEN (`one`, intern
# `1`) — und seine Vorgabe belegt BEIDE mit `goto_tab`. Nachweis: die hier
# unberührten Ziffern 7 und 8 stehen in `ghostty +list-keybinds` doppelt.
#
# Die erste Fassung band nur `cmd+one`, also den übersetzten Steckplatz. Der
# physische blieb auf `goto_tab:1` — und genau der gewinnt beim Tastendruck.
# Ergebnis: ⌘1 wechselte den Ghostty-Tab, statt das Cockpit zu erreichen; die
# Tastensteuerung wirkte tot, obwohl tmux und Dashboard beide korrekt waren.
#
# Beide Steckplätze zu belegen macht die Frage nach der Vorrangregel
# gegenstandslos: welcher auch immer greift, das Ergebnis ist dasselbe.
#
# Abnahme:
#   ghostty +validate-config                              → keine Ausgabe
#   ghostty +list-keybinds | grep -E 'super\+(digit_)?[1-6]='
#     → 12 Zeilen, alle text:…ck1..ck6, KEIN goto_tab
#   ghostty +list-keybinds | grep -E 'super\+(digit_)?[789]='
#     → goto_tab muss dort UNBERÜHRT stehen (sonst zu viel gekapert)
keybind = cmd+physical:one=text:\x1bck1
keybind = cmd+one=text:\x1bck1
keybind = cmd+physical:two=text:\x1bck2
keybind = cmd+two=text:\x1bck2
keybind = cmd+physical:three=text:\x1bck3
keybind = cmd+three=text:\x1bck3
keybind = cmd+physical:four=text:\x1bck4
keybind = cmd+four=text:\x1bck4
keybind = cmd+physical:five=text:\x1bck5
keybind = cmd+five=text:\x1bck5
keybind = cmd+physical:six=text:\x1bck6
keybind = cmd+six=text:\x1bck6
