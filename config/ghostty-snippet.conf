# Cockpit: ⌘+1..7 → card focus (7 since 2026-09-24: card 1 = Model & Effort) (replaces tab switching; tabs still via ⌘+Shift+[ / ])
# Insert into ~/.config/ghostty/config, then ⌘+Shift+, (reload_config).
#
# WHY EVERY DIGIT TWICE (fixed 2026-08-04):
# Ghostty carries TWO slots per key — the PHYSICAL key (`physical:one`,
# internally `digit_1`) and the CHARACTER produced (`one`, internally `1`) —
# and its default assigns BOTH to `goto_tab`. Proof: digits 7 and 8, left
# untouched here, appear twice in `ghostty +list-keybinds`.
#
# The first version bound only `cmd+one`, i.e. the translated slot. The
# physical one stayed on `goto_tab:1` — and that's exactly the one that wins
# on a keypress. Result: ⌘1 switched the Ghostty tab instead of reaching
# Cockpit; keyboard control looked dead even though tmux and the dashboard
# were both correct.
#
# Assigning both slots makes the precedence question moot: whichever one
# fires, the result is the same.
#
# Acceptance:
#   ghostty +validate-config                              → no output
#   ghostty +list-keybinds | grep -E 'super\+(digit_)?[1-7]='
#     → 14 lines, all text:…ck1..ck7, NO goto_tab
#   ghostty +list-keybinds | grep -E 'super\+(digit_)?[89]='
#     → goto_tab must stand there UNTOUCHED (otherwise too much was captured)
keybind = cmd+physical:one=text:\x1bck1
keybind = cmd+one=text:\x1bck1
keybind = cmd+physical:two=text:\x1bck2
keybind = cmd+two=text:\x1bck2
keybind = cmd+physical:three=text:\x1bck3
keybind = cmd+three=text:\x1bck3
keybind = cmd+physical:four=text:\x1bck4
keybind = cmd+four=text:\x1bck4
keybind = cmd+physical:five=text:\x1bck5
keybind = cmd+five=text:\x1bck5
keybind = cmd+physical:six=text:\x1bck6
keybind = cmd+six=text:\x1bck6
keybind = cmd+physical:seven=text:\x1bck7
keybind = cmd+seven=text:\x1bck7
