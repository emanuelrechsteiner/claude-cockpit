# Cockpit tmux-Konfiguration
set -g allow-passthrough on

# WARUM `mouse on` (revidiert 2026-09-23, Nutzerentscheidung — vorher `mouse
# off`, siehe docs/adr/0001-maus-statt-nur-tastatur.md):
# Klick auf ein Pane setzt dort den Fokus (ersetzt/ergaenzt ⌘1-6), und die
# senkrechte Trennlinie zwischen den beiden Panes laesst sich per Ziehen
# (Klick auf die Linie halten, Maus bewegen, loslassen) frei verschieben —
# vorher war beides nur mit dieser Option aus erreichbar (tmux liefert
# Klick-Fokus und Trennlinien-Resize ueber dieselbe Mausberichterstattung).
# Nebenwirkungen, gemessen 2026-09-23:
#  - Das Mausrad scrollt jetzt durch die tmux-Historie des Panes statt durch
#    das native Terminal-Scrollback der App darunter zu gehen.
#  - Text mit der Maus markieren (fuer Kopieren) braucht in Ghostty eine
#    Zusatztaste, weil tmux die Mausereignisse sonst selbst verbraucht:
#    Ghostty sendet bei gehaltener UMSCHALTTASTE (Shift) waehrend Klick/Ziehen
#    die native Terminal-Selektion statt sie an tmux weiterzureichen (Standard
#    `mouse-shift-capture = false`, `ghostty +show-config --default --docs`,
#    Zeile 1097-1122: "The default value of `false` means that the shift key
#    is not sent with the mouse protocol and will extend the selection.").
#    Fuer Terminal.app: nicht geprueft.
set -g mouse on
set -g default-terminal "tmux-256color"

# ⌘+1..6 kommen von Ghostty als ESC c k <n>; immer ans rechte (Dashboard-)Pane
set -s user-keys[10] "\eck1"
set -s user-keys[11] "\eck2"
set -s user-keys[12] "\eck3"
set -s user-keys[13] "\eck4"
set -s user-keys[14] "\eck5"
set -s user-keys[15] "\eck6"

# WARUM zusaetzlich `select-pane` (2026-08-04):
# tmux leitet nur diese sechs Tasten um. Pfeile und Enter gehen ans AKTIVE
# Pane — und das war links bei Claude. Man konnte also eine Karte anwaehlen,
# aber darin nichts tun: ein Bedienpult, dessen Wahlschalter verkabelt ist,
# waehrend die Knoepfe darunter noch am Nachbarpult haengen.
#
# Statt jede Navigationstaste einzeln umzuleiten (das haette ⌘←/⌘→ als
# Zeilenanfang/-ende und ⌘↑/⌘↓ als Prompt-Sprung gekostet), wandert der Fokus
# mit: ⌘1-6 waehlt die Karte UND macht das Dashboard zum aktiven Pane. Pfeile
# und Enter wirken danach ohne jede weitere Bindung — GUI-Verhalten.
# Den Rueckweg geht die App selbst (src/ui/paneFocus.ts): esc gibt den Fokus
# zurueck, und ein versehentlich hier getipptes Zeichen wird nach links
# durchgereicht, damit nichts verloren geht.
bind -n User10 send-keys -t "{right}" Escape c k 1 \; select-pane -t "{right}"
bind -n User11 send-keys -t "{right}" Escape c k 2 \; select-pane -t "{right}"
bind -n User12 send-keys -t "{right}" Escape c k 3 \; select-pane -t "{right}"
bind -n User13 send-keys -t "{right}" Escape c k 4 \; select-pane -t "{right}"
bind -n User14 send-keys -t "{right}" Escape c k 5 \; select-pane -t "{right}"
bind -n User15 send-keys -t "{right}" Escape c k 6 \; select-pane -t "{right}"
