# Cockpit tmux configuration
set -g allow-passthrough on

# WHY `mouse on` (revised 2026-09-23, user decision — previously `mouse
# off`, see docs/adr/0001-mouse-not-only-keyboard.md):
# Clicking a pane sets focus there (replaces/complements ⌘1-6), and the
# vertical divider between the two panes can be freely dragged (hold the
# click on the line, move the mouse, release) — previously both were only
# reachable with this option off (tmux delivers click-focus and
# divider-resize over the same mouse reporting).
# Side effects, measured 2026-09-23:
#  - The mouse wheel now scrolls through the pane's tmux history instead of
#    the native terminal scrollback of the app underneath.
#  - Selecting text with the mouse (for copying) needs an extra key in
#    Ghostty, because tmux otherwise consumes the mouse events itself:
#    Ghostty sends the native terminal selection instead of forwarding it to
#    tmux when SHIFT is held during click/drag (default
#    `mouse-shift-capture = false`, `ghostty +show-config --default --docs`,
#    line 1097-1122: "The default value of `false` means that the shift key
#    is not sent with the mouse protocol and will extend the selection.").
#    Not checked for Terminal.app.
set -g mouse on
set -g default-terminal "tmux-256color"

# ⌘+1..7 arrive from Ghostty as ESC c k <n>; always routed to the right (dashboard) pane
set -s user-keys[10] "\eck1"
set -s user-keys[11] "\eck2"
set -s user-keys[12] "\eck3"
set -s user-keys[13] "\eck4"
set -s user-keys[14] "\eck5"
set -s user-keys[15] "\eck6"
set -s user-keys[16] "\eck7"

# WHY `select-pane` is added (2026-08-04):
# tmux only routes these six keys. Arrows and Enter go to the ACTIVE pane —
# and that was Claude on the left. So you could select a card but do nothing
# in it: a control panel whose selector is wired up while the buttons
# underneath still belong to the neighboring panel.
#
# Instead of rerouting every navigation key individually (which would have
# cost ⌘←/⌘→ as line-start/-end and ⌘↑/⌘↓ as prompt jump), focus moves along:
# ⌘1-6 selects the card AND makes the dashboard the active pane. Arrows and
# Enter then work without any further binding — GUI behavior.
# The app itself handles the way back (src/ui/paneFocus.ts): esc returns
# focus, and a character typed here by accident is forwarded left, so
# nothing is lost.
bind -n User10 send-keys -t "{right}" Escape c k 1 \; select-pane -t "{right}"
bind -n User11 send-keys -t "{right}" Escape c k 2 \; select-pane -t "{right}"
bind -n User12 send-keys -t "{right}" Escape c k 3 \; select-pane -t "{right}"
bind -n User13 send-keys -t "{right}" Escape c k 4 \; select-pane -t "{right}"
bind -n User14 send-keys -t "{right}" Escape c k 5 \; select-pane -t "{right}"
bind -n User15 send-keys -t "{right}" Escape c k 6 \; select-pane -t "{right}"
bind -n User16 send-keys -t "{right}" Escape c k 7 \; select-pane -t "{right}"

# Colors (2026-09-26): the vertical divider carries the design's focus color
# (palette slot 6 = focus #34d1d6 in the "rcode" Ghostty theme), the inactive
# line the muted gray (slot 8). The green status bar is a tmux default and
# already sits on slot 2 at go #5fb800.
set -g pane-border-style "fg=colour8"
set -g pane-active-border-style "fg=colour6"
